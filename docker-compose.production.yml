services:
  traefik:
    image: traefik:v3.6
    command:
      - --api.insecure=false
      - --providers.swarm=true
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --certificatesresolvers.myresolver.acme.tlschallenge=true
      - --certificatesresolvers.myresolver.acme.email=alextermure@protonmail.com
      - --certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json
    networks: [edge]
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-lets-encrypt:/letsencrypt
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  web:
    image: ghcr.io/jackjakarta/easycron:${TAG_VERSION}
    command: ['node', 'server.js']
    networks: [edge]
    env_file:
      - .env
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.labels.easycron.role == app
        preferences:
          - spread: node.hostname
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 384M
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 20s
        max_failure_ratio: 0.2
      rollback_config:
        order: stop-first
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.docker.network=easycron_edge

        # main router
        - traefik.http.routers.easycron.rule=Host(`easycron.dev`) || Host(`api.easycron.dev`)
        - traefik.http.routers.easycron.entrypoints=websecure
        - traefik.http.routers.easycron.tls=true
        - traefik.http.routers.easycron.tls.certresolver=myresolver
        - traefik.http.services.easycron.loadbalancer.server.port=3000

        # www to non-www redirect
        - traefik.http.routers.easycron-www.rule=Host(`www.easycron.dev`)
        - traefik.http.routers.easycron-www.entrypoints=websecure
        - traefik.http.routers.easycron-www.tls=true
        - traefik.http.routers.easycron-www.tls.certresolver=myresolver
        - traefik.http.routers.easycron-www.middlewares=www-redirect
        - traefik.http.middlewares.www-redirect.redirectregex.regex=^https://www\.(.*)
        - traefik.http.middlewares.www-redirect.redirectregex.replacement=https://$${1}
        - traefik.http.middlewares.www-redirect.redirectregex.permanent=true

  worker:
    image: ghcr.io/jackjakarta/easycron:${TAG_VERSION}
    command: ['node', 'dist/worker/index.js']
    networks: [edge]
    env_file:
      - .env
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.labels.easycron.role == app
        preferences:
          - spread: node.hostname
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 384M
      update_config:
        order: stop-first
        parallelism: 1
        failure_action: rollback
        monitor: 10s
        delay: 5s
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=false
    healthcheck:
      test: ['CMD', 'node', '-e', 'process.exit(0)']
      interval: 30s
      timeout: 3s
      retries: 3

  scheduler:
    image: ghcr.io/jackjakarta/easycron:${TAG_VERSION}
    command: ['node', 'dist/scheduler/index.js']
    networks: [edge]
    env_file:
      - .env
    environment:
      NODE_OPTIONS: '--max-old-space-size=512'
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.easycron.role == app
        preferences:
          - spread: node.hostname
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 192M
      update_config:
        order: stop-first
        parallelism: 1
        delay: 5s
        failure_action: rollback
        monitor: 10s
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=false

  redis:
    image: redis:7-alpine
    networks: [edge]
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
    env_file:
      - .env
    volumes:
      - redis_data:/data
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.easycron.role == redis
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=false
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a $REDIS_PASSWORD ping']
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  edge:
    driver: overlay

volumes:
  traefik-lets-encrypt:
  redis_data:
