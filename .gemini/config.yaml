# Config for the Gemini Pull Request Review Bot.
# https://github.com/marketplace/gemini-code-assist
have_fun: false
code_review:
  disable: false
  comment_severity_threshold: HIGH
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: true
    code_review: true
ignore_patterns:
  [
    'pnpm-lock.yaml',
    'yarn.lock',
    'package-lock.json',
    'dist/**',
    'build/**',
    'out/**',
    '*.config.js',
    '*.config.cjs',
    '*.config.mjs',
  ]
